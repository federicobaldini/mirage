; ============================================================
;  Mirage — ESP32-S3 WiFi Security Tool for M5Stack Cardputer
; ============================================================
[platformio]
default_envs = m5stack-cardputer

[env:m5stack-cardputer]
platform          = espressif32 @ ^6.9.0
board             = m5stack-stamps3
framework         = arduino

; ── CPU / Flash / RAM ────────────────────────────────────────
board_build.mcu              = esp32s3
board_build.f_cpu            = 240000000L
board_build.flash_size       = 8MB
board_build.flash_mode       = qio
board_build.arduino.memory_type = qio_opi   ; enables OPI-PSRAM
board_upload.flash_size      = 8MB
board_build.partitions       = default_8MB.csv

; ── Libraries ────────────────────────────────────────────────
lib_deps =
    m5stack/M5Unified   @ ^0.2.2
    m5stack/M5Cardputer @ ^1.0.1

; ── Compiler flags ───────────────────────────────────────────
; Strip the framework's default -std=gnu++11 so our gnu++17 flag is not
; overridden (the last -std= flag on the command line wins).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DCORE_DEBUG_LEVEL=3
    -Wno-unused-variable
    -Wno-missing-field-initializers
    -I${PROJECT_DIR}/.pio/libdeps/m5stack-cardputer/M5Cardputer/src

; ── Serial monitor ───────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; ============================================================
;  Keyboard diagnostic — standalone, does NOT build src/
;  Upload:  pio run -e kb-test -t upload
;  Monitor: pio device monitor -e kb-test
; ============================================================
[env:kb-test]
platform          = espressif32 @ ^6.9.0
board             = m5stack-stamps3
framework         = arduino
src_dir           = test/kb_test

board_build.mcu              = esp32s3
board_build.f_cpu            = 240000000L
board_build.flash_size       = 8MB
board_build.flash_mode       = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size      = 8MB
board_build.partitions       = default_8MB.csv

lib_deps =
    m5stack/M5Unified   @ ^0.2.2
    m5stack/M5Cardputer @ ^1.0.1

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DCORE_DEBUG_LEVEL=5
    -Wno-unused-variable
    -Wno-missing-field-initializers
    -I${PROJECT_DIR}/.pio/libdeps/kb-test/M5Cardputer/src

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize
